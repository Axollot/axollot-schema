syntax = "proto3";

package axollot.files.v1;

import "common.proto";

service FileService {
  rpc RequestUploadUrl(RequestUploadUrlRequest) returns (RequestUploadUrlResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse);
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
  rpc GetAttachmentsMetadata(GetAttachmentsMetadataRequest) returns (GetAttachmentsMetadataResponse);
}

message RequestUploadUrlRequest {
  string filename = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  oneof access_context {
    string channel_id = 4;
    string guild_id = 5;
  }
}

message RequestUploadUrlResponse {
  axollot.common.v1.Status status = 1;
  string attachment_id = 2;
  string upload_url = 3;
}

message ConfirmUploadRequest {
  string attachment_id = 1;
}

message ConfirmUploadResponse {
  axollot.common.v1.Status status = 1;
}

message GetDownloadUrlRequest {
  string attachment_id = 1;
}

message GetDownloadUrlResponse {
  axollot.common.v1.Status status = 1;
  string download_url = 2;
}

message GetAttachmentsMetadataRequest {
  repeated string attachment_ids = 1;
}

message AttachmentMetadata {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
}

message GetAttachmentsMetadataResponse {
  repeated AttachmentMetadata attachments = 1;
}