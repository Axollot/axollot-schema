syntax = "proto3";

package axollot.internal.v1;

service InternalAuthService {
  rpc VerifySessionToken(VerifySessionTokenRequest) returns (VerifySessionTokenResponse);
  rpc CheckChannelAccess(CheckChannelAccessRequest) returns (CheckChannelAccessResponse);
  rpc CheckGuildPermission(CheckGuildPermissionRequest) returns (CheckGuildPermissionResponse);
}

message VerifySessionTokenRequest {
  string session_token = 1;
}

message VerifySessionTokenResponse {
  bool valid = 1;
  string user_id = 2;
}

message CheckChannelAccessRequest {
  string user_id = 1;
  string channel_id = 2;
}

message CheckChannelAccessResponse {
  bool has_access = 1;
}

message CheckGuildPermissionRequest {
  string user_id = 1;
  string guild_id = 2;
  int64 required_permission = 3;
}
message CheckGuildPermissionResponse {
  bool has_permission = 1;
}