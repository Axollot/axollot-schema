syntax = "proto3";

package axollot.gateway.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";
import "messaging.proto";
import "guild.proto";
import "people.proto";

// WebSocket — ТОЛЬКО real-time события и хендшейк.
// Всё что request/response (история, списки, CRUD) — через gRPC сервисы.
//
// Совместимость: и клиент, и сервер ОБЯЗАНЫ молча игнорировать пакет
// с незнакомым payload и незнакомые значения enum (не падать, не рвать WS).
// Новые события добавляются только новыми номерами в oneof.

enum MediaKind {
    MEDIA_KIND_UNSPECIFIED = 0;
    MEDIA_KIND_AUDIO = 1;
    MEDIA_KIND_VIDEO = 2;
}

message Handshake {
    string session_token = 1;
    optional string last_received_msg_id = 2;
    string client_version = 3;   // напр. "1.0.0"
    uint32 protocol_version = 4; // 1 для Axollot 1.0
}

message HandshakeAck {
    axollot.common.v1.Status status = 1;
    string user_id = 2;
    repeated axollot.messaging.v1.MessageEvent missed_messages = 3;
    repeated ChannelReadStateEntry read_states = 4;
    string server_version = 5;
    uint32 protocol_version = 6;
    // true — пропущенных сообщений больше лимита, клиент догружает историю через gRPC
    bool missed_messages_truncated = 7;
}

message ChannelReadStateEntry {
    string channel_id = 1;
    string last_read_message_id = 2;
}

message Ping {
    google.protobuf.Timestamp client_time = 1;
}

message Pong {
    google.protobuf.Timestamp client_time = 1;
    google.protobuf.Timestamp server_time = 2;
}

// Ответ на клиентский пакет, который сервер не смог обработать.
// Packet.request_id и ErrorEvent.request_id = request_id исходного пакета.
message ErrorEvent {
    string request_id = 1;
    axollot.common.v1.Status status = 2;
}

// --- Сообщения ---

message TypingEvent {
    string channel_id = 1;
    string user_id = 2;
}

message MessageEditedEvent {
    string message_id = 1;
    string channel_id = 2;
    string new_text = 3;
    google.protobuf.Timestamp edited_at = 4;
}

message MessageDeletedEvent {
    string message_id = 1;
    string channel_id = 2;
}

message ReadStateUpdatedEvent {
    string channel_id = 1;
    string last_read_message_id = 2;
}

// --- Пользователи ---

message PresenceEvent {
    string user_id = 1;
    axollot.people.v1.OnlineStatus status = 2;
}

// Смена имени/аватара. Шлётся всем, кто видит пользователя
// (друзья, DM-собеседники, участники общих гильдий) и другим его сессиям.
message UserUpdatedEvent {
    string user_id = 1;
    string public_username = 2;
    string avatar_url = 3; // "" = нет аватара
}

message FriendRequestEvent {
    string from_user_id = 1;
}

// Изменение отношения с user_id с точки зрения получателя:
// принятие заявки, удаление из друзей, отмена/отклонение заявки.
// Блокировку получателю не сообщаем.
message FriendshipUpdatedEvent {
    string user_id = 1;
    axollot.people.v1.FriendStatus status = 2;
}

// --- Гильдии ---

message GuildMemberJoinedEvent {
    string guild_id = 1;
    string member_id = 2;
}

enum MemberLeaveReason {
    MEMBER_LEAVE_REASON_UNSPECIFIED = 0;
    MEMBER_LEAVE_REASON_LEFT = 1;
    MEMBER_LEAVE_REASON_KICKED = 2;
    MEMBER_LEAVE_REASON_BANNED = 3;
}

message GuildMemberLeftEvent {
    string guild_id = 1;
    string user_id = 2;
    MemberLeaveReason reason = 3;
}

message GuildUpdatedEvent {
    axollot.guild.v1.Guild guild = 1;
}

message GuildDeletedEvent {
    string guild_id = 1;
}

// Создание/изменение/удаление/перестановка ролей гильдии.
// Клиент перезапрашивает GetGuildRoles и GetMyPermissions.
message GuildRolesChangedEvent {
    string guild_id = 1;
}

// Роли участника изменились (AssignRole/UnassignRole).
message MemberRolesChangedEvent {
    string guild_id = 1;
    string user_id = 2;
    repeated string role_ids = 3; // полный актуальный список
}

message ChannelCreatedEvent {
    axollot.guild.v1.Channel channel = 1;
}

message ChannelDeletedEvent {
    string guild_id = 1;
    string channel_id = 2;
}

message ChannelUpdatedEvent {
    axollot.guild.v1.Channel channel = 1;
}

// --- Состояние приложения ---

enum AppLifecycleState {
    APP_LIFECYCLE_STATE_UNSPECIFIED = 0;
    APP_LIFECYCLE_STATE_FOREGROUND = 1;
    APP_LIFECYCLE_STATE_BACKGROUND = 2;
}

message AppStateEvent {
    AppLifecycleState state = 1;
}

// --- Voice ---

message JoinVoiceChannel { string channel_id = 1; }
message LeaveVoiceChannel { string channel_id = 1; }
message VoiceTransportConnect { string transport_id = 1; string dtls_parameters = 2; }
message VoiceProduce {
    string transport_id = 1;
    MediaKind kind = 2;
    string rtp_parameters = 3;
}

message VoiceNewProducer {
    string user_id = 1;
    string producer_id = 2;
    MediaKind kind = 3;
}

message VoiceConsumerReady {
    string consumer_id = 1;
    string producer_id = 2;
    MediaKind kind = 3;
    string rtp_parameters = 4;
}

message VoiceProducerClosed {
    string user_id = 1;
    string producer_id = 2;
    MediaKind kind = 3;
}

message VoiceCloseProducer { string producer_id = 1; }

message VoiceTransportInfo {
    string transport_id = 1;
    string ice_parameters = 2;
    string ice_candidates = 3;
    string dtls_parameters = 4;
    string direction = 5; // "send" или "recv"
}
message VoiceJoined {
    string router_rtp_capabilities = 1;
    repeated VoiceTransportInfo transports = 2; // send + recv transport info
}
message VoiceParticipantLeft { string user_id = 1; }

message VoiceConsume { string producer_id = 1; string rtp_capabilities = 2; }
message VoiceProduceAck {
    string transport_id = 1;
    string producer_id = 2;
    MediaKind kind = 3;
}
message VoiceChannelPresenceUpdate {
    string channel_id = 1;
    repeated string user_ids = 2;
}

// --- Звонки ---

// Инициация звонка
message CallUser {
    string channel_id = 1; // DM channel id
}

// Уведомление получателю о входящем звонке
message IncomingCall {
    string channel_id = 1;
    string caller_id = 2;
    string call_id = 3; // уникальный id этой попытки звонка
    int64 initiated_at = 4;
}

// Ответ получателя
message AnswerCall { string call_id = 1; }
message DeclineCall { string call_id = 1; }

// Инициатор отменяет пока ещё звонит (получатель не ответил)
message CancelCall { string call_id = 1; }

// Уведомление о том что звонок принят/отклонён/отменён - обеим сторонам
message CallAccepted { string call_id = 1; }
message CallDeclined { string call_id = 1; }
message CallCancelled { string call_id = 1; }
enum CallEndReason {
    CALL_END_REASON_UNSPECIFIED = 0;
    CALL_END_REASON_HANGUP = 1;
    CALL_END_REASON_TIMEOUT = 2;
    CALL_END_REASON_DECLINED = 3;
}
message CallEnded { string call_id = 1; CallEndReason reason = 2; }

// Ответ сервера инициатору сразу после CallUser - даёт call_id для последующего CancelCall
message CallInitiated {
    string call_id = 1;
    string channel_id = 2;
}

// Конверт для WebSocket
message Packet {
    string request_id = 1;

    oneof payload {
        // Соединение
        Handshake handshake = 2;
        HandshakeAck handshake_ack = 3;
        Ping ping = 4;
        Pong pong = 5;

        // Сообщения (отправка + входящие)
        axollot.messaging.v1.SendMessage send_message = 10;
        axollot.messaging.v1.MessageEvent message_event = 11;
        MessageDeletedEvent message_deleted = 12;
        MessageEditedEvent message_edited = 13;
        TypingEvent typing = 14;

        // Присутствие
        PresenceEvent presence = 20;

        // Друзья
        FriendRequestEvent friend_request = 30;

        // Гильдии
        GuildMemberJoinedEvent guild_member_joined = 40;
        GuildMemberLeftEvent guild_member_left = 41;

        ChannelCreatedEvent channel_created = 42;
        ChannelDeletedEvent channel_deleted = 43;
        ChannelUpdatedEvent channel_updated = 44;

        AppStateEvent app_state = 45;

        ReadStateUpdatedEvent read_state_update = 46;

        // Voice
        JoinVoiceChannel join_voice = 50;
        LeaveVoiceChannel leave_voice = 51;
        VoiceTransportConnect voice_transport_connect = 52;
        VoiceProduce voice_produce = 53;
        VoiceJoined voice_joined = 54;
        VoiceNewProducer voice_new_producer = 55;
        VoiceParticipantLeft voice_participant_left = 56;
        VoiceConsume voice_consume = 57;
        VoiceConsumerReady voice_consumer_ready = 58;

        VoiceProduceAck voice_produce_ack = 59;

        VoiceChannelPresenceUpdate voice_presence_update = 60;

        // Звонки
        CallUser call_user = 61;
        IncomingCall incoming_call = 62;
        AnswerCall answer_call = 63;
        DeclineCall decline_call = 64;
        CancelCall cancel_call = 65;
        CallAccepted call_accepted = 66;
        CallDeclined call_declined = 67;
        CallCancelled call_cancelled = 68;
        CallEnded call_ended = 69;
        CallInitiated call_initiated = 70;

        VoiceProducerClosed voice_producer_closed = 71;
        VoiceCloseProducer voice_close_producer = 72;

        // Ошибки
        ErrorEvent error = 73;

        // Пользователи / гильдии (1.0)
        UserUpdatedEvent user_updated = 74;
        FriendshipUpdatedEvent friendship_updated = 75;
        GuildUpdatedEvent guild_updated = 76;
        GuildDeletedEvent guild_deleted = 77;
        GuildRolesChangedEvent guild_roles_changed = 78;
        MemberRolesChangedEvent member_roles_changed = 79;
    }
}
